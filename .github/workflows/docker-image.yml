name: Docker Image CI

on:
  push:
    tags:
      - '*'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag <your-docker-image-name>

    - name: Run vulnerability scan
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy --exit-code 1 --severity HIGH <your-docker-image-name>

    - name: Push to Docker Hub
      run: |
        echo "Lanidor#2019" | docker login -u marceloffigueiredo57@gmail.com --password-stdin
        docker push <your-docker-image-name>
