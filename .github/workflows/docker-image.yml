name: Docker Image CI

on:
  push:
    tags:
      - '*'

jobs:

  build_StandDigital:

    runs-on: ubuntu-latest
    env:
      ImageName: standdigital
    steps:
    - uses: actions/checkout@v2

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag $ImageName

    - name: Run vulnerability scan
      run: |
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy --exit-code 1 --severity HIGH $ImageName

    - name: Push to Docker Hub
      run: |
        echo {{secrets.DOCKERHUBPASS}} | docker login -u {{secrets.DOCKERHUBUSER}} --password-stdin
        docker push $ImageName
